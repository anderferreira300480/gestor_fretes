<div class="card shadow-sm border-0">
    <div class="card-header bg-white py-3">
        <h4 class="card-title mb-0 text-primary fw-bold">
            <i class="fa-solid fa-file-circle-plus me-2"></i>Novo Pedido de Compra
        </h4>
    </div>
    <div class="card-body p-4">
        <form id="form-pedido-compra" class="ajax-form" action="/pedidos/salvar" method="POST">

            <!-- 1. DETALHES DO PEDIDO & CARGA -->
            <div class="mb-4">
                <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
                    <i class="fa-solid fa-truck-ramp-box me-2 text-primary"></i>1. Detalhes do Pedido & Carga
                </h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="numero_pedido" class="form-label fw-semibold">Número do Pedido/NF</label>
                        <input type="text" class="form-control" id="numero_pedido" name="numero_pedido" placeholder="Ex: PED-2026-001">
                    </div>
                    <div class="col-md-3">
                        <label for="volumes" class="form-label fw-semibold">Volumes</label>
                        <input type="number" class="form-control" id="volumes" name="volumes" placeholder="Ex: 5">
                    </div>
                    <div class="col-md-3">
                        <label for="peso_kg" class="form-label fw-semibold">Peso Total (kg)</label>
                        <input type="number" step="0.01" class="form-control" id="peso_kg" name="peso_kg" placeholder="0.00">
                    </div>
                    <div class="col-md-3">
                        <label for="valor_carga" class="form-label fw-semibold">Valor da Carga (R$)</label>
                        <input type="number" step="0.01" class="form-control" id="valor_carga" name="valor_carga" placeholder="0.00">
                    </div>

                    <div class="col-md-4">
                        <label for="dim_altura" class="form-label fw-semibold">Altura (m)</label>
                        <input type="number" step="0.01" class="form-control" id="dim_altura" name="dim_altura" placeholder="Ex: 1.20">
                    </div>
                    <div class="col-md-4">
                        <label for="dim_largura" class="form-label fw-semibold">Largura (m)</label>
                        <input type="number" step="0.01" class="form-control" id="dim_largura" name="dim_largura" placeholder="Ex: 1.00">
                    </div>
                    <div class="col-md-4">
                        <label for="dim_comprimento" class="form-label fw-semibold">Comprimento (m)</label>
                        <input type="number" step="0.01" class="form-control" id="dim_comprimento" name="dim_comprimento" placeholder="Ex: 2.50">
                    </div>

                    <div class="col-md-12">
                        <label for="observacoes" class="form-label fw-semibold">Observações / Instruções de Transporte</label>
                        <textarea class="form-control" id="observacoes" name="observacoes" rows="3" placeholder="Insira detalhes adicionais sobre a coleta ou entrega..."></textarea>
                    </div>
                </div>
            </div>

            <!-- 2. EMPRESA / COMPRADORA -->
            <div class="mb-4">
                <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
                    <i class="fa-solid fa-building me-2 text-primary"></i>2. Empresa / Compradora
                </h5>
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="empresa_id" class="form-label fw-semibold">Selecionar Empresa Compradora</label>
                        <select class="form-select" id="empresa_id" name="empresa_id" required>
                            <option value="">-- Selecione uma Empresa --</option>
                            {% for emp in empresas %}
                                <option value="{{ emp.id }}">{{ emp.razao_social }} (CNPJ: {{ emp.cnpj }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="emp_endereco" class="form-label">Endereço</label>
                        <input type="text" class="form-control" id="emp_endereco" name="emp_endereco">
                    </div>
                    <div class="col-md-2">
                        <label for="emp_numero" class="form-label">Número</label>
                        <input type="text" class="form-control" id="emp_numero" name="emp_numero">
                    </div>
                    <div class="col-md-4">
                        <label for="emp_bairro" class="form-label">Bairro</label>
                        <input type="text" class="form-control" id="emp_bairro" name="emp_bairro">
                    </div>
                    <div class="col-md-8">
                        <label for="emp_cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="emp_cidade" name="emp_cidade">
                    </div>
                    <div class="col-md-4">
                        <label for="emp_estado" class="form-label">UF</label>
                        <input type="text" class="form-control" id="emp_estado" name="emp_estado" maxlength="2">
                    </div>

                    <!-- Campos de Contato (Preenchimento manual pelo usuário) -->
                    <div class="col-md-4">
                        <label for="emp_nome_contato" class="form-label fw-semibold">Nome de Contato</label>
                        <input type="text" class="form-control" id="emp_nome_contato" name="emp_nome_contato">
                    </div>
                    <div class="col-md-4">
                        <label for="emp_email" class="form-label fw-semibold">E-mail</label>
                        <input type="email" class="form-control" id="emp_email" name="emp_email">
                    </div>
                    <div class="col-md-4">
                        <label for="emp_telefone" class="form-label fw-semibold">Telefone</label>
                        <input type="text" class="form-control mascara-telefone" id="emp_telefone" name="emp_telefone">
                    </div>
                </div>
            </div>

            <!-- 3. FORNECEDOR -->
            <div class="mb-4">
                <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
                    <i class="fa-solid fa-boxes-packing me-2 text-primary"></i>3. Fornecedor
                </h5>
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="fornecedor_id" class="form-label fw-semibold">Selecionar Fornecedor</label>
                        <select class="form-select" id="fornecedor_id" name="fornecedor_id" required>
                            <option value="">-- Selecione um Fornecedor --</option>
                            {% for forn in fornecedores %}
                                <option value="{{ forn.id }}">{{ forn.razao_social }} (CNPJ: {{ forn.cnpj }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="forn_endereco" class="form-label">Endereço de Origem</label>
                        <input type="text" class="form-control" id="forn_endereco" name="forn_endereco">
                    </div>
                    <div class="col-md-2">
                        <label for="forn_numero" class="form-label">Número</label>
                        <input type="text" class="form-control" id="forn_numero" name="forn_numero">
                    </div>
                    <div class="col-md-4">
                        <label for="forn_bairro" class="form-label">Bairro</label>
                        <input type="text" class="form-control" id="forn_bairro" name="forn_bairro">
                    </div>
                    <div class="col-md-8">
                        <label for="forn_cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="forn_cidade" name="forn_cidade">
                    </div>
                    <div class="col-md-4">
                        <label for="forn_estado" class="form-label">UF</label>
                        <input type="text" class="form-control" id="forn_estado" name="forn_estado" maxlength="2">
                    </div>

                    <!-- Campos de Contato do Fornecedor -->
                    <div class="col-md-4">
                        <label for="forn_nome_contato" class="form-label">Nome de Contato</label>
                        <input type="text" class="form-control" id="forn_nome_contato" name="forn_nome_contato">
                    </div>
                    <div class="col-md-4">
                        <label for="forn_email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="forn_email" name="forn_email">
                    </div>
                    <div class="col-md-4">
                        <label for="forn_telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control mascara-telefone" id="forn_telefone" name="forn_telefone">
                    </div>
                </div>
            </div>

            <!-- BOTÕES DE AÇÃO -->
            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                <button type="button" class="btn btn-outline-secondary" onclick="carregarTela('/kanban')">Cancelar</button>
                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Salvar Pedido
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    (function() {
        function aplicarMascaraTelefone(input) {
            if (!input) return;
            let v = input.value.replace(/\D/g, '').substring(0, 11);
            if (v.length > 10) {
                v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
            } else if (v.length > 5) {
                v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
            } else if (v.length > 2) {
                v = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
            } else if (v.length > 0) {
                v = v.replace(/^(\d*)$/, '($1');
            }
            input.value = v;
        }

        // --- SELEÇÃO DE EMPRESA ---
        const selectEmpresa = document.getElementById('empresa_id');
        if (selectEmpresa) {
            selectEmpresa.addEventListener('change', function() {
                const empresaId = this.value;
                
                // Limpa os campos de endereço
                document.getElementById('emp_endereco').value = '';
                document.getElementById('emp_numero').value = '';
                document.getElementById('emp_bairro').value = '';
                document.getElementById('emp_cidade').value = '';
                document.getElementById('emp_estado').value = '';

                if (!empresaId) return;

                fetch('/pedidos/api/empresa/' + empresaId)
                    .then(res => res.json())
                    .then(data => {
                        if (data.erro) return;
                        // Preenche APENAS os dados de endereço da Empresa
                        document.getElementById('emp_endereco').value = data.endereco || '';
                        document.getElementById('emp_numero').value = data.numero || '';
                        document.getElementById('emp_bairro').value = data.bairro || '';
                        document.getElementById('emp_cidade').value = data.cidade || '';
                        document.getElementById('emp_estado').value = data.estado || '';
                        
                        // Nota: Nome de Contato, E-mail e Telefone da empresa NÃO são preenchidos
                        // para permitirem digitação manual.
                    })
                    .catch(err => console.error('Erro ao buscar empresa:', err));
            });
        }

        // --- SELEÇÃO DE FORNECEDOR ---
        const selectFornecedor = document.getElementById('fornecedor_id');
        if (selectFornecedor) {
            selectFornecedor.addEventListener('change', function() {
                const fornecedorId = this.value;
                
                document.getElementById('forn_endereco').value = '';
                document.getElementById('forn_numero').value = '';
                document.getElementById('forn_bairro').value = '';
                document.getElementById('forn_cidade').value = '';
                document.getElementById('forn_estado').value = '';
                document.getElementById('forn_nome_contato').value = '';
                document.getElementById('forn_email').value = '';
                document.getElementById('forn_telefone').value = '';

                if (!fornecedorId) return;

                fetch('/pedidos/api/fornecedor/' + fornecedorId)
                    .then(res => res.json())
                    .then(data => {
                        if (data.erro) return;
                        document.getElementById('forn_endereco').value = data.endereco || '';
                        document.getElementById('forn_numero').value = data.numero || '';
                        document.getElementById('forn_bairro').value = data.bairro || '';
                        document.getElementById('forn_cidade').value = data.cidade || '';
                        document.getElementById('forn_estado').value = data.estado || '';
                        document.getElementById('forn_nome_contato').value = data.nome_contato || '';
                        document.getElementById('forn_email').value = data.email || '';

                        const telInput = document.getElementById('forn_telefone');
                        if (telInput) {
                            telInput.value = data.telefone || '';
                            aplicarMascaraTelefone(telInput);
                        }
                    })
                    .catch(err => console.error('Erro ao buscar fornecedor:', err));
            });
        }

        // Aplica a máscara aos campos de telefone
        document.querySelectorAll('.mascara-telefone').forEach(input => {
            input.setAttribute('maxlength', '15');
            input.addEventListener('input', function() {
                aplicarMascaraTelefone(this);
            });
        });
    })();
</script>
