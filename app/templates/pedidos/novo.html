{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm col-md-8 mx-auto">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Cadastrar Novo Pedido de Compra</h4>
    </div>
    <div class="card-body">
        <form method="POST" action="/pedidos/novo">
            <div class="mb-3">
                <label class="form-label">Número do Pedido de Compra</label>
                <input type="text" name="numero_pedido_compra" class="form-control" placeholder="Ex: PC-1002" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Empresa Compradora</label>
                <select name="empresa_id" class="form-select" required>
                    <option value="">Selecione a empresa...</option>
                    {% for empresa in empresas %}
                        <option value="{{ empresa.id }}">{{ empresa.razao_social }} ({{ empresa.cnpj }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Fornecedor</label>
                <input type="text" name="fornecedor" class="form-control" placeholder="Razão social do fornecedor" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Valor Mercadoria (R$)</label>
                    <input type="number" step="0.01" name="valor_mercadoria" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Peso Total (kg)</label>
                    <input type="number" step="0.01" name="peso_kg" class="form-control">
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100">Criar Pedido</button>
        </form>
    </div>
</div>
{% endblock %}
