{% for c in pedido.cotacoes %}
<tr class="{% if c.vencedora %}table-success{% endif %}">
    <td>{{ c.transportadora.razao_social if c.transportadora else 'N/A' }}</td>
    <td>R$ {{ '%.2f'|format(c.valor_frete|float) }}</td>
    <td>{{ c.prazo_dias }} dias</td>
    <td class="text-center">
        {% if not c.vencedora %}
        <form method="POST" action="/cotacoes/{{ c.id }}/selecionar-vencedor" class="ajax-form" style="display:inline;">
            <button class="btn btn-sm btn-outline-success fw-semibold">Aprovar</button>
        </form>
        {% else %}
        <span class="badge bg-success">Vencedora</span>
        {% endif %}
    </td>
</tr>
{% endfor %}
