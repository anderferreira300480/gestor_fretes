<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRUPO FRETELOG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 0.85rem; background-color: #f4f6f9; }
        .sidebar { width: 90px; background-color: #0f172a; min-height: 100vh; }
        .sidebar a { color: #94a3b8; text-decoration: none; font-size: 0.7rem; text-align: center; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background-color: #1e293b; }
    </style>
</head>
<body class="d-flex">

    <!-- Menu Lateral Dark -->
    <div class="sidebar d-flex flex-column align-items-center py-3">
        <a href="/" class="py-3 w-100 active">
            <div>📊</div> Dashboard
        </a>
        <a href="/pedidos/novo" class="py-3 w-100">
            <div>📄</div> Novo Pedido
        </a>
        <a href="#" class="py-3 w-100">
            <div>📁</div> Cadastros
        </a>
        <a href="#" class="py-3 w-100">
            <div>📈</div> Relatórios
        </a>
    </div>

    <!-- Conteúdo Principal -->
    <div class="flex-grow-1">
        <!-- Topbar -->
        <nav class="navbar navbar-dark bg-dark px-4 py-2">
            <span class="navbar-brand fw-bold mb-0 h1">GRUPO FRETELOG</span>
            <input class="form-control w-25 bg-secondary text-white border-0" type="search" placeholder="Buscar">
        </nav>

        <div class="p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

</body>
</html>
