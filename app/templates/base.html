<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRUPO FRETELOG</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --topbar-height: 56px;
            --sidebar-width: 70px;
            --bg-dark-top: #0b1329;
            --bg-dark-side: #0b1329;
            --bg-body: #f4f6f9;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-body);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Topbar Escura */
        .topbar-header {
            height: var(--topbar-height);
            background-color: var(--bg-dark-top);
            color: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1030;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            border-bottom: 1px solid #1a233a;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-decoration: none;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
            color: #e2e8f0;
        }

        /* Sidebar Minimalista Escura */
        .sidebar-menu {
            width: var(--sidebar-width);
            position: fixed;
            top: var(--topbar-height);
            bottom: 0;
            left: 0;
            background-color: var(--bg-dark-side);
            z-index: 1020;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 0.5rem;
            border-right: 1px solid #1a233a;
        }

        .sidebar-menu .nav-item {
            width: 100%;
            position: relative;
        }

        .sidebar-menu .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            padding: 0.75rem 0;
            font-size: 0.68rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .sidebar-menu .nav-link i {
            font-size: 1.35rem;
            margin-bottom: 0.3rem;
        }

        .sidebar-menu .nav-link:hover,
        .sidebar-menu .nav-link.active {
            color: #38bdf8;
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #38bdf8;
        }

        /* Dropdown Flyout de Cadastros */
        .dropdown-cadastros {
            position: absolute;
            top: 0;
            left: var(--sidebar-width);
            background-color: #0b1329;
            border: 1px solid #1a233a;
            border-radius: 0 8px 8px 0;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
            min-width: 180px;
            display: none;
            z-index: 1050;
            padding: 0.3rem 0;
        }

        .dropdown-cadastros.show {
            display: block;
        }

        .dropdown-cadastros .dropdown-item {
            color: #cbd5e1;
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: background 0.2s, color 0.2s;
            text-decoration: none;
            cursor: pointer;
        }

        .dropdown-cadastros .dropdown-item:hover {
            background-color: #1e293b;
            color: #38bdf8;
        }

        /* Container Principal */
        #conteudo-principal {
            margin-top: var(--topbar-height);
            margin-left: var(--sidebar-width);
            padding: 1.5rem;
            min-height: calc(100vh - var(--topbar-height));
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR (TOPBAR) -->
    <header class="topbar-header">
        <a href="/kanban" class="topbar-brand" onclick="carregarTela('/kanban'); return false;">
            <i class="bi bi-list fs-4 text-white"></i>
            <span>GRUPO FRETELOG</span>
        </a>
        
        <div class="topbar-user">
            <i class="bi bi-person-fill fs-5"></i>
            <span>Anderson Ferreira</span>
        </div>
    </header>

    <!-- MENU LATERAL (SIDEBAR COM ÍCONES CONFORME IMAGEM) -->
    <nav class="sidebar-menu">
        <ul class="nav flex-column w-100">
            <!-- Dashboard / Kanban -->
            <li class="nav-item">
                <a class="nav-link active" href="/kanban" id="link-dashboard" onclick="carregarTela('/kanban'); fecharMenuCadastros(); return false;">
                    <i class="bi bi-grid-fill"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <!-- Novo Pedido -->
            <li class="nav-item">
                <a class="nav-link" href="/pedidos/novo" id="link-novo-pedido" onclick="carregarTela('/pedidos/novo'); fecharMenuCadastros(); return false;">
                    <i class="bi bi-box-seam"></i>
                    <span>Novo Pedido</span>
                </a>
            </li>

            <!-- Cadastros (Com Dropdown Flyout) -->
            <li class="nav-item" id="item-cadastros">
                <a class="nav-link" id="btn-toggle-cadastros" onclick="toggleMenuCadastros(event)">
                    <i class="bi bi-folder-fill"></i>
                    <span>Cadastros</span>
                </a>

                <!-- Submenu Flyout de Cadastros com URL dinâmica do Flask -->
                <div class="dropdown-cadastros" id="menu-dropdown-cadastros">
                    <a href="{{ url_for('cadastros.empresas') if 'cadastros.empresas' in config.get('ENDPOINTS', []) else '/cadastros/empresas' }}" 
                       class="dropdown-item" 
                       onclick="carregarTela(this.getAttribute('href')); fecharMenuCadastros(); return false;">
                        <i class="bi bi-building"></i>
                        <span>Empresas</span>
                    </a>
                    
                    <a href="{{ url_for('cadastros.fornecedores') if 'cadastros.fornecedores' in config.get('ENDPOINTS', []) else '/cadastros/fornecedores' }}" 
                       class="dropdown-item" 
                       onclick="carregarTela(this.getAttribute('href')); fecharMenuCadastros(); return false;">
                        <i class="bi bi-boxes"></i>
                        <span>Fornecedores</span>
                    </a>
                    
                    <a href="{{ url_for('cadastros.transportadoras') if 'cadastros.transportadoras' in config.get('ENDPOINTS', []) else '/cadastros/transportadoras' }}" 
                       class="dropdown-item" 
                       onclick="carregarTela(this.getAttribute('href')); fecharMenuCadastros(); return false;">
                        <i class="bi bi-truck"></i>
                        <span>Transportadoras</span>
                    </a>
                </div>
            </li>

            <!-- Relatórios -->
            <li class="nav-item">
                <a class="nav-link" href="/relatorios" id="link-relatorios" onclick="carregarTela('/relatorios'); fecharMenuCadastros(); return false;">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Relatórios</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- ÁREA DE CONTEÚDO DINÂMICO -->
    <main id="conteudo-principal">
        {% block content %}
        <!-- Conteúdo do Dashboard renderizado via Jinja2 ou carregado por AJAX -->
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SCRIPTS DE CONTROLE DO DROPDOWN E MOTOR AJAX -->
    <script>
        // Lógica de Abertura/Fechamento do Menu Cadastros
        function toggleMenuCadastros(event) {
            if (event) event.stopPropagation();
            const dropdown = document.getElementById('menu-dropdown-cadastros');
            dropdown.classList.toggle('show');
        }

        function fecharMenuCadastros() {
            const dropdown = document.getElementById('menu-dropdown-cadastros');
            if (dropdown) dropdown.classList.remove('show');
        }

        // Fecha o menu de cadastros ao clicar fora dele
        document.addEventListener('click', function(e) {
            const itemCadastros = document.getElementById('item-cadastros');
            if (itemCadastros && !itemCadastros.contains(e.target)) {
                fecharMenuCadastros();
            }
        });

        // Função principal para carregar as telas dinamicamente sem reload
        window.carregarTela = function(url) {
            if (!url || url === '#' || url.startsWith('javascript:')) return;

            fetch(url, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                // Se a primeira tentativa de rota falhar com 404 para cadastros, tenta a URL alternativa com /cadastros/
                if (response.status === 404 && !url.includes('/cadastros/')) {
                    const fallbackUrl = '/cadastros' + (url.startsWith('/') ? url : '/' + url);
                    return fetch(fallbackUrl, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
                }
                if (!response.ok) throw new Error('Status HTTP: ' + response.status);
                return response;
            })
            .then(response => response.text())
            .then(html => {
                const container = document.getElementById('conteudo-principal');
                if (!container) return;

                // Extrai o conteúdo do <main> se a resposta for um HTML completo
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const mainContent = doc.querySelector('main#conteudo-principal') || doc.querySelector('main') || doc.body;

                container.innerHTML = mainContent ? mainContent.innerHTML : html;

                // Re-executa os scripts da tela injetada
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });

                // Atualiza o destaque do menu selecionado
                document.querySelectorAll('.sidebar-menu .nav-link').forEach(link => {
                    link.classList.remove('active');
                });

                if (url === '/kanban') {
                    document.getElementById('link-dashboard')?.classList.add('active');
                } else if (url === '/pedidos/novo') {
                    document.getElementById('link-novo-pedido')?.classList.add('active');
                } else if (url.includes('empresa') || url.includes('fornecedor') || url.includes('transportadora')) {
                    document.getElementById('btn-toggle-cadastros')?.classList.add('active');
                } else if (url === '/relatorios') {
                    document.getElementById('link-relatorios')?.classList.add('active');
                }
            })
            .catch(error => {
                console.error('Erro ao carregar a tela:', error);
                window.location.href = url;
            });
        };

        // Carrega o Dashboard automaticamente quando a página inicial for aberta sem conteúdo
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('conteudo-principal');
            if (container && container.children.length === 0) {
                carregarTela('/kanban');
            }
        });

        // Interceptador global para formulários AJAX
        document.addEventListener('submit', function(e) {
            if (e.target && e.target.classList.contains('ajax-form')) {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                const url = form.action;
                const method = form.method || 'POST';

                fetch(url, {
                    method: method,
                    body: formData,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso || data.redirect) {
                        carregarTela(data.redirect || '/kanban');
                    } else if (data.erro) {
                        alert(data.erro);
                    }
                })
                .catch(err => {
                    console.error('Erro ao enviar formulário:', err);
                });
            }
        });
    </script>
</body>
</html>
