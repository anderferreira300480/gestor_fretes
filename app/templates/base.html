<!DOCTYPE html>
<!-- Layout global: menu fixo, area de conteudo e carregamento AJAX dos fragmentos. -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRUPO COPELMI - GESTÃO DE FRETES - COMPRAS</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --topbar-height: 56px;
            --sidebar-width: 70px;
            --bg-dark-top: #0b1329;
            --bg-dark-side: #0b1329;
            --bg-body: #f4f6f9;
        }

        body {
            min-height: 100vh;
            height: 100vh;
            background-color: var(--bg-body);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* Topbar Escura */
        .topbar-header {
            height: var(--topbar-height);
            background-color: var(--bg-dark-top);
            color: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1030;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            border-bottom: 1px solid #1a233a;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-decoration: none;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
            color: #e2e8f0;
        }

        /* Sidebar Minimalista Escura */
        .sidebar-menu {
            width: var(--sidebar-width);
            position: fixed;
            top: var(--topbar-height);
            bottom: 0;
            left: 0;
            background-color: var(--bg-dark-side);
            z-index: 1020;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 0.5rem;
            border-right: 1px solid #1a233a;
        }

        .sidebar-menu .nav-item {
            width: 100%;
            position: relative;
        }

        .sidebar-menu .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            padding: 0.75rem 0;
            font-size: 0.68rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .sidebar-menu .nav-link i {
            font-size: 1.35rem;
            margin-bottom: 0.3rem;
        }

        .sidebar-menu .nav-link:hover,
        .sidebar-menu .nav-link.active {
            color: #38bdf8;
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #38bdf8;
        }

        /* Dropdown Flyout de Cadastros */
        .dropdown-cadastros {
            position: absolute;
            top: 0;
            left: var(--sidebar-width);
            background-color: #0b1329;
            border: 1px solid #1a233a;
            border-radius: 0 8px 8px 0;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
            min-width: 180px;
            display: none;
            z-index: 1050;
            padding: 0.3rem 0;
        }

        .dropdown-cadastros.show {
            display: block;
        }

        .dropdown-cadastros .dropdown-item {
            color: #cbd5e1;
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: background 0.2s, color 0.2s;
            text-decoration: none;
            cursor: pointer;
        }

        .dropdown-cadastros .dropdown-item:hover {
            background-color: #1e293b;
            color: #38bdf8;
        }

        /* Container Principal */
        #conteudo-principal {
            margin-top: var(--topbar-height);
            margin-left: var(--sidebar-width);
            padding: 1.5rem;
            height: calc(100vh - var(--topbar-height));
            overflow-x: hidden;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .kanban-shell {
            height: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 0;
            overflow: hidden;
        }

        .kanban-toolbar {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(244, 246, 249, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
            flex-shrink: 0;
        }

        .kanban-board {
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
            overflow: hidden;
        }

        .kanban-column {
            display: flex;
            min-height: 0;
            height: 100%;
            overflow: hidden;
        }

        .kanban-column .card-header {
            flex-shrink: 0;
        }

        .kanban-column .card {
            width: 100%;
            min-height: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-radius: 14px;
            overflow: hidden;
        }

        .kanban-column-body {
            flex: 1 1 auto;
            overflow-y: auto;
            min-height: 0;
            height: 0;
            max-height: 100%;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.7) transparent;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
        }

        .kanban-column-body::-webkit-scrollbar {
            width: 8px;
        }

        .kanban-column-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .kanban-column-body::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.7);
            border-radius: 999px;
        }

        .kanban-card-actions {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.35rem;
        }

        .kanban-card-actions .btn {
            width: 100%;
            min-width: 0;
            min-height: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: normal;
            overflow-wrap: anywhere;
            line-height: 1.15;
        }

        /* Dark Premium Theme Overlay - only visual styling */
        :root {
            --glass-bg-1: #07111c;
            --glass-bg-2: #0d1c2a;
            --glass-surface: rgba(17, 30, 43, 0.48);
            --glass-surface-strong: rgba(22, 34, 47, 0.72);
            --glass-surface-soft: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-highlight: rgba(123, 219, 255, 0.28);
            --glass-text: #ebf7ff;
            --glass-text-soft: #b8d3e6;
            --glass-cyan: #7ee7ff;
            --glass-violet: #8ba7ff;
            --glass-teal: #6fe8c3;
            --glass-gold: #ffd47b;
            --glass-orange: #ffab75;
            --glass-red: #ff7a90;
            --glass-blue: #7bb5ff;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(126, 231, 255, 0.18), transparent 28%),
                radial-gradient(circle at top right, rgba(139, 167, 255, 0.16), transparent 26%),
                linear-gradient(180deg, var(--glass-bg-1) 0%, var(--glass-bg-2) 100%) !important;
            color: var(--glass-text) !important;
        }

        #conteudo-principal {
            background: transparent !important;
        }

        .topbar-header {
            background: rgba(12, 21, 31, 0.56) !important;
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border-bottom: 1px solid var(--glass-border) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16) !important;
        }

        .sidebar-menu {
            background: rgba(11, 19, 27, 0.48) !important;
            backdrop-filter: blur(18px) saturate(1.5);
            -webkit-backdrop-filter: blur(18px) saturate(1.5);
            border-right: 1px solid var(--glass-border) !important;
        }

        .sidebar-menu .nav-link {
            color: var(--glass-text-soft) !important;
        }

        .sidebar-menu .nav-link:hover,
        .sidebar-menu .nav-link.active {
            color: var(--glass-gold) !important;
            background: linear-gradient(90deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)) !important;
            border-left: 3px solid var(--glass-gold) !important;
            box-shadow: inset 0 0 18px rgba(255,255,255,0.03);
        }

        .dropdown-cadastros {
            background: rgba(12, 21, 31, 0.72) !important;
            border: 1px solid var(--glass-border) !important;
            backdrop-filter: blur(18px) saturate(1.5);
            -webkit-backdrop-filter: blur(18px) saturate(1.5);
            box-shadow: 0 22px 38px rgba(0, 0, 0, 0.25) !important;
        }

        .dropdown-cadastros .dropdown-item {
            color: var(--glass-text) !important;
        }

        .dropdown-cadastros .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.06) !important;
            color: var(--glass-gold) !important;
        }

        .topbar-header .topbar-brand,
        .topbar-header .topbar-user {
            text-shadow: 0 0 16px rgba(126, 231, 255, 0.18);
        }

        .topbar-header .topbar-brand:hover {
            color: var(--glass-cyan) !important;
        }

        .kanban-toolbar {
            background: rgba(17, 27, 39, 0.48) !important;
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-color: var(--glass-border) !important;
            box-shadow: 0 18px 40px rgba(7, 13, 20, 0.28) !important;
        }

        .kanban-toolbar h3,
        .kanban-toolbar .text-muted,
        .kanban-toolbar .small,
        .kanban-toolbar .fw-semibold,
        .kanban-toolbar .fw-bold,
        .kanban-toolbar .text-dark,
        .kanban-toolbar .form-select,
        .kanban-toolbar .btn {
            color: var(--glass-text) !important;
        }

        .kanban-toolbar .bg-white,
        .kanban-toolbar .border,
        .kanban-toolbar .shadow-sm,
        .kanban-toolbar .form-select {
            background: rgba(20, 32, 43, 0.58) !important;
            border-color: var(--glass-border) !important;
            box-shadow: none !important;
        }

        .card,
        .card-body,
        .card-header,
        .card-footer,
        .modal-content,
        .list-group-item,
        .table,
        .table td,
        .table th,
        .dropdown-menu,
        .form-control,
        .form-select,
        .input-group-text,
        .accordion-item,
        .accordion-body,
        .accordion-header,
        .offcanvas,
        .toast,
        .alert,
        .nav-tabs .nav-link {
            background-color: rgba(18, 31, 42, 0.5) !important;
            color: var(--glass-text) !important;
            border-color: var(--glass-border) !important;
            backdrop-filter: blur(12px) saturate(1.2);
            -webkit-backdrop-filter: blur(12px) saturate(1.2);
        }

        .card {
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.10) !important;
        }

        .card-header {
            background: linear-gradient(135deg, rgba(17, 31, 42, 0.9), rgba(29, 47, 65, 0.8)) !important;
            color: var(--glass-text) !important;
            border-bottom: 1px solid var(--glass-border) !important;
        }

        .bg-white,
        .bg-light,
        .bg-body-tertiary,
        .bg-success-subtle,
        .bg-info-subtle,
        .bg-warning-subtle,
        .bg-danger-subtle,
        .bg-primary-subtle,
        .bg-secondary-subtle {
            background: rgba(20, 31, 42, 0.55) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .text-dark,
        .text-body,
        .text-secondary,
        .text-muted,
        .small,
        .text-info,
        .text-success,
        .text-warning,
        .text-primary,
        .text-danger {
            color: var(--glass-text) !important;
        }

        .text-muted,
        .small,
        .text-secondary {
            opacity: 0.82;
        }

        .btn {
            border-color: rgba(255,255,255,0.12) !important;
            box-shadow: none !important;
        }

        .btn-outline-primary,
        .btn-outline-secondary,
        .btn-outline-success,
        .btn-outline-danger,
        .btn-outline-info,
        .btn-outline-warning {
            background: rgba(255,255,255,0.04) !important;
            color: var(--glass-text) !important;
            backdrop-filter: blur(8px);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(126, 231, 255, 0.9), rgba(92, 132, 255, 0.9)) !important;
            border-color: rgba(126, 231, 255, 0.7) !important;
            color: #061720 !important;
            box-shadow: 0 10px 24px rgba(126, 231, 255, 0.22) !important;
        }

        .btn-danger {
            background: linear-gradient(135deg, rgba(255, 122, 144, 0.9), rgba(221, 74, 94, 0.9)) !important;
            border-color: rgba(255, 122, 144, 0.7) !important;
        }

        .btn-success {
            background: linear-gradient(135deg, rgba(111, 232, 195, 0.88), rgba(52, 163, 128, 0.9)) !important;
            border-color: rgba(111, 232, 195, 0.7) !important;
            color: #061b17 !important;
        }

        .btn-info {
            background: linear-gradient(135deg, rgba(123, 181, 255, 0.9), rgba(82, 113, 255, 0.9)) !important;
            border-color: rgba(123, 181, 255, 0.7) !important;
            color: #051522 !important;
        }

        .form-control,
        .form-select,
        .input-group-text {
            background: rgba(9, 17, 24, 0.64) !important;
            border-color: var(--glass-border) !important;
            color: var(--glass-text) !important;
            backdrop-filter: blur(8px);
        }

        .form-select option,
        .form-control option {
            background-color: #111d29 !important;
            color: var(--glass-text) !important;
        }

        .table-striped > tbody > tr:nth-of-type(odd) > * {
            background-color: rgba(255, 255, 255, 0.02) !important;
        }

        .modal-backdrop {
            background-color: rgba(5, 12, 18, 0.68) !important;
            backdrop-filter: blur(6px);
        }

        .modal-content {
            box-shadow: 0 22px 44px rgba(0, 0, 0, 0.32) !important;
        }

        .dropdown-menu,
        .dropdown-item {
            background: rgba(15, 25, 35, 0.7) !important;
            color: var(--glass-text) !important;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.06) !important;
            color: var(--glass-cyan) !important;
        }

        .border,
        .border-top,
        .border-bottom,
        .border-start,
        .border-end,
        .border-0,
        .shadow-sm,
        .shadow {
            border-color: var(--glass-border) !important;
            box-shadow: none !important;
        }

        .kanban-column > .card {
            background: linear-gradient(180deg, rgba(17, 30, 42, 0.66), rgba(13, 21, 32, 0.72)) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            box-shadow: 0 20px 34px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255,255,255,0.04) !important;
        }

        .kanban-column > .card .card-header {
            background: linear-gradient(135deg, rgba(36, 65, 89, 0.9), rgba(11, 26, 38, 0.92)) !important;
            color: var(--glass-text) !important;
            border-bottom: 1px solid var(--glass-border) !important;
        }

        .kanban-column .card-body .card {
            background: rgba(13, 23, 33, 0.7) !important;
        }

        .modal {
            --bs-modal-bg: rgba(18, 31, 42, 0.72) !important;
        }

        .modal-content {
            background: linear-gradient(180deg, rgba(24, 37, 52, 0.92) 0%, rgba(15, 24, 35, 0.9) 100%) !important;
            border: 1px solid var(--glass-border) !important;
            box-shadow: 0 20px 42px rgba(0, 0, 0, 0.24) !important;
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
        }

        .modal-header,
        .modal-footer,
        .modal-body {
            background: transparent !important;
            border-color: var(--glass-border) !important;
            color: var(--glass-text) !important;
        }

        .modal-header.bg-light,
        .modal-header.bg-warning-subtle,
        .modal-header.bg-success-subtle,
        .modal-header.bg-danger-subtle,
        .modal-header.bg-info-subtle {
            background: linear-gradient(135deg, rgba(27, 43, 58, 0.86), rgba(20, 31, 42, 0.88)) !important;
            border-bottom: 1px solid var(--glass-border) !important;
        }

        .modal-title,
        .modal-body,
        .modal-body *,
        .modal-footer,
        .modal-footer *,
        .modal-header * {
            color: var(--glass-text) !important;
        }

        .modal .bg-light,
        .modal .bg-warning-subtle,
        .modal .bg-success-subtle,
        .modal .bg-danger-subtle,
        .modal .bg-info-subtle,
        #resumoPedidoCotacao,
        #detalheCargaCotacao,
        #formNovaCotacao,
        #formEditarCotacao,
        #formNovoAnexo,
        .table-responsive,
        .table,
        .table-striped > tbody > tr:nth-of-type(odd) > * {
            background: rgba(17, 29, 40, 0.7) !important;
            border-color: var(--glass-border) !important;
            color: var(--glass-text) !important;
        }

        .modal .alert-success,
        .modal .alert-warning,
        .modal .alert-info,
        .modal .alert-danger {
            background: rgba(17, 27, 39, 0.8) !important;
            border-color: var(--glass-border) !important;
            color: var(--glass-text) !important;
        }

        .modal .table-dark {
            background: linear-gradient(135deg, rgba(24, 36, 48, 0.9), rgba(18, 27, 39, 0.88)) !important;
            color: var(--glass-text) !important;
        }

        .modal .btn-close {
            filter: invert(1) grayscale(100%) brightness(100%);
        }

        .btn-primary:hover,
        .btn-success:hover,
        .btn-info:hover,
        .btn-danger:hover,
        .btn-outline-primary:hover,
        .btn-outline-secondary:hover,
        .btn-outline-success:hover,
        .btn-outline-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.2) !important;
        }

        .card {
            border: 1px solid rgba(255,255,255,0.10) !important;
        }

        .bi,
        .fa-solid,
        .fa-regular,
        .fa-brands {
            filter: drop-shadow(0 0 0 rgba(0, 0, 0, 0));
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR (TOPBAR) -->
    <header class="topbar-header">
        <a href="/kanban" class="topbar-brand" onclick="carregarTela('/kanban'); return false;">
            <i class="bi bi-list fs-4 text-white"></i>
            <span>GRUPO COPELMI - GESTÃO FRETES - COMPRAS</span>
        </a>
        
        <div class="topbar-user">
            <i class="bi bi-person-fill fs-5"></i>
            <span>Anderson Ferreira</span>
        </div>
    </header>

    <!-- MENU LATERAL (SIDEBAR COM ÍCONES CONFORME IMAGEM) -->
    <nav class="sidebar-menu">
        <ul class="nav flex-column w-100">
            <!-- Dashboard / Kanban -->
            <li class="nav-item">
                <a class="nav-link active" href="/kanban" id="link-dashboard" onclick="carregarTela('/kanban'); fecharMenuCadastros(); return false;">
                    <i class="bi bi-grid-fill"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <!-- Novo Pedido -->
            <li class="nav-item">
                <a class="nav-link" href="/pedidos/novo" id="link-novo-pedido" onclick="carregarTela('/pedidos/novo'); fecharMenuCadastros(); return false;">
                    <i class="bi bi-box-seam"></i>
                    <span>Novo Pedido</span>
                </a>
            </li>

            <!-- Cadastros (Com Dropdown Flyout) -->
            <li class="nav-item" id="item-cadastros">
                <a class="nav-link" id="btn-toggle-cadastros" onclick="toggleMenuCadastros(event)">
                    <i class="bi bi-folder-fill"></i>
                    <span>Cadastros</span>
                </a>

                <!-- Submenu Flyout de Cadastros com URL dinâmica do Flask -->
                <div class="dropdown-cadastros" id="menu-dropdown-cadastros">
                    <a href="{{ url_for('cadastros.empresas') if 'cadastros.empresas' in config.get('ENDPOINTS', []) else '/cadastros/empresas' }}" 
                       class="dropdown-item" 
                       onclick="carregarTela(this.getAttribute('href')); fecharMenuCadastros(); return false;">
                        <i class="bi bi-building"></i>
                        <span>Empresas</span>
                    </a>
                    
                    <a href="{{ url_for('cadastros.fornecedores') if 'cadastros.fornecedores' in config.get('ENDPOINTS', []) else '/cadastros/fornecedores' }}" 
                       class="dropdown-item" 
                       onclick="carregarTela(this.getAttribute('href')); fecharMenuCadastros(); return false;">
                        <i class="bi bi-boxes"></i>
                        <span>Fornecedores</span>
                    </a>
                    
                    <a href="{{ url_for('cadastros.transportadoras') if 'cadastros.transportadoras' in config.get('ENDPOINTS', []) else '/cadastros/transportadoras' }}" 
                       class="dropdown-item" 
                       onclick="carregarTela(this.getAttribute('href')); fecharMenuCadastros(); return false;">
                        <i class="bi bi-truck"></i>
                        <span>Transportadoras</span>
                    </a>
                </div>
            </li>

            <!-- Relatórios -->
            <li class="nav-item">
                <a class="nav-link{% if tela_ativa == 'relatorios' %} active{% endif %}" href="/relatorios" id="link-relatorios" onclick="carregarTela('/relatorios'); fecharMenuCadastros(); return false;">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Relatórios</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- ÁREA DE CONTEÚDO DINÂMICO -->
    <main id="conteudo-principal">
        {% block content %}
        <!-- Conteúdo do Dashboard renderizado via Jinja2 ou carregado por AJAX -->
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SCRIPTS DE CONTROLE DO DROPDOWN E MOTOR AJAX -->
    <script>
        // Lógica de Abertura/Fechamento do Menu Cadastros
        function toggleMenuCadastros(event) {
            if (event) event.stopPropagation();
            const dropdown = document.getElementById('menu-dropdown-cadastros');
            dropdown.classList.toggle('show');
        }

        function fecharMenuCadastros() {
            const dropdown = document.getElementById('menu-dropdown-cadastros');
            if (dropdown) dropdown.classList.remove('show');
        }

        // Fecha o menu de cadastros ao clicar fora dele
        document.addEventListener('click', function(e) {
            const itemCadastros = document.getElementById('item-cadastros');
            if (itemCadastros && !itemCadastros.contains(e.target)) {
                fecharMenuCadastros();
            }
        });

        // Função principal para carregar as telas dinamicamente sem reload
        window.carregarTela = function(url) {
            if (!url || url === '#' || url.startsWith('javascript:')) return;

            fetch(url, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                // Se a primeira tentativa de rota falhar com 404 para cadastros, tenta a URL alternativa com /cadastros/
                if (response.status === 404 && !url.includes('/cadastros/')) {
                    const fallbackUrl = '/cadastros' + (url.startsWith('/') ? url : '/' + url);
                    return fetch(fallbackUrl, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
                }
                if (!response.ok) throw new Error('Status HTTP: ' + response.status);
                return response;
            })
            .then(response => response.text())
            .then(html => {
                const container = document.getElementById('conteudo-principal');
                if (!container) return;

                // Extrai o conteúdo do <main> se a resposta for um HTML completo
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const mainContent = doc.querySelector('main#conteudo-principal') || doc.querySelector('main') || doc.body;

                // Mantém os estilos do fragmento carregado no head do documento para
                // que o layout do dashboard e seus cards tenham regra de altura/scroll.
                const fragmentStyles = Array.from(doc.querySelectorAll('style'));
                fragmentStyles.forEach(styleNode => {
                    const existing = Array.from(document.head.querySelectorAll('style[data-ajax-fragment]'))
                        .find(el => el.textContent === styleNode.textContent);
                    if (!existing) {
                        const clone = document.createElement('style');
                        clone.dataset.ajaxFragment = 'true';
                        clone.textContent = styleNode.textContent;
                        document.head.appendChild(clone);
                    }
                });

                container.innerHTML = mainContent ? mainContent.innerHTML : html;

                // Re-executa os scripts da tela injetada
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });

                // Atualiza o destaque do menu selecionado
                document.querySelectorAll('.sidebar-menu .nav-link').forEach(link => {
                    link.classList.remove('active');
                });

                if (url === '/kanban' || url.startsWith('/kanban?')) {
                    document.getElementById('link-dashboard')?.classList.add('active');
                } else if (url === '/pedidos/novo') {
                    document.getElementById('link-novo-pedido')?.classList.add('active');
                } else if (url.includes('empresa') || url.includes('fornecedor') || url.includes('transportadora')) {
                    document.getElementById('btn-toggle-cadastros')?.classList.add('active');
                } else if (url === '/relatorios' || url.startsWith('/relatorios?')) {
                    document.getElementById('link-relatorios')?.classList.add('active');
                }
            })
            .catch(error => {
                console.error('Erro ao carregar a tela:', error);
                window.location.href = url;
            });
        };

        // Sem empresa_id, a rota retorna todos os pedidos. Com um ID, retorna
        // somente os pedidos vinculados à empresa selecionada.
        window.filtrarPorEmpresa = function(empresaId) {
            const url = empresaId
                ? `/kanban?empresa_id=${encodeURIComponent(empresaId)}`
                : '/kanban';
            carregarTela(url);
        };

        // Carrega o Dashboard automaticamente quando a página inicial for aberta sem conteúdo
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('conteudo-principal');
            if (container && container.children.length === 0) {
                carregarTela('/kanban');
            }
        });

        // Interceptador global para formulários AJAX
        document.addEventListener('submit', function(e) {
            if (e.target && e.target.classList.contains('ajax-form')) {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                const url = form.action;
                const method = form.method || 'POST';

                fetch(url, {
                    method: method,
                    body: formData,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso || data.redirect) {
                        carregarTela(data.redirect || '/kanban');
                    } else if (data.erro) {
                        alert(data.erro);
                    }
                })
                .catch(err => {
                    console.error('Erro ao enviar formulário:', err);
                });
            }
        });
    </script>
</body>
</html>
